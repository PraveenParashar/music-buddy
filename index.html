<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tune Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎵 Tune Quest</div>
    <div class="stats">
      <span id="streak" title="Day streak">🔥 0</span>
      <span id="xp" title="Total XP">⭐ 0 XP</span>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-tab="learn" class="active">📚<span>Learn</span></button>
    <button data-tab="piano">🎹<span>Piano</span></button>
    <button data-tab="badges">🏅<span>Badges</span></button>
  </nav>

  <script src="app.js?v=no-cache"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</body>
</html>
